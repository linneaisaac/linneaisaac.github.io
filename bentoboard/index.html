---
layout: default
title: Bentoboard
---

<style>
.bb-page {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 2rem;
  max-width: 1200px;
  margin: 2rem auto;
  font-family: et-book, Palatino, "Palatino Linotype", "Palatino LT STD", "Book Antiqua", Georgia, serif;
}

.bb-sidebar h2 {
  font-size: 1.4rem;
  margin: 0 0 0.4rem 0;
}
.bb-sidebar .bb-hint {
  font-style: italic;
  font-size: 0.95rem;
  color: #555;
  margin: 0 0 1.5rem 0;
}
.bb-meta {
  margin-bottom: 1.4rem;
}
.bb-meta-title {
  font-variant: small-caps;
  letter-spacing: 0.08em;
  font-size: 0.95rem;
  color: #888;
  margin-bottom: 0.3rem;
}
.bb-value {
  padding: 0.35rem 0;
  cursor: pointer;
  border-bottom: 1px dotted transparent;
  font-size: 1.05rem;
}
.bb-value:hover {
  border-bottom-color: #999;
}
.bb-value.bb-active {
  font-weight: bold;
}
.bb-value-panel {
  display: none;
  padding: 0.6rem 0.2rem 0.4rem 0.8rem;
  border-left: 2px solid #ccc;
  margin: 0.2rem 0 0.4rem 0.2rem;
}
.bb-value.bb-active + .bb-value-panel {
  display: block;
}
.bb-value-desc {
  font-size: 0.9rem;
  color: #555;
  margin-bottom: 0.5rem;
}
.bb-value-panel input {
  width: 100%;
  font-family: inherit;
  font-size: 1rem;
  padding: 0.3rem 0.4rem;
  border: 1px solid #bbb;
  box-sizing: border-box;
}
.bb-value-panel button {
  margin-top: 0.4rem;
  font-family: inherit;
  font-size: 0.95rem;
  padding: 0.25rem 0.8rem;
  background: #f5f5f0;
  border: 1px solid #aaa;
  cursor: pointer;
}
.bb-value-panel button:hover {
  background: #e8e8e0;
}

.bb-board-wrap {
  display: flex;
  flex-direction: column;
}
.bb-board-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.8rem;
}
.bb-board-header h1 {
  font-size: 1.8rem;
  margin: 0;
}
.bb-clear {
  font-family: inherit;
  font-size: 0.9rem;
  padding: 0.3rem 0.8rem;
  background: #f5f5f0;
  border: 1px solid #aaa;
  cursor: pointer;
}
.bb-clear:hover {
  background: #f0d8d8;
}

.bb-status {
  min-height: 1.5rem;
  font-style: italic;
  color: #333;
  margin-bottom: 0.6rem;
  font-size: 1.15rem;
}
.bb-status.bb-status-alert {
  color: #a04030;
  font-weight: bold;
  font-style: normal;
}

.bb-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 140px);
  gap: 10px;
  background: #faf8f2;
  padding: 12px;
  border: 1px solid #ddd;
}
.bb-slot {
  border: 1px dashed #c4b8a4;
  background: #fffdf6;
  padding: 0.6rem;
  display: flex;
  flex-direction: column;
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
.bb-slot[data-size="big"]   { grid-column: span 2; grid-row: span 2; }
.bb-slot[data-size="wide"]  { grid-column: span 2; grid-row: span 1; }
.bb-slot[data-size="small"] { grid-column: span 1; grid-row: span 1; }

.bb-board.bb-placing .bb-slot.bb-empty {
  cursor: pointer;
  border-color: #8b5a2b;
  background: #fff5e0;
  animation: bb-pulse 1.2s ease-in-out infinite;
}
@keyframes bb-pulse {
  0%, 100% { background: #fff5e0; }
  50%      { background: #ffe6b8; }
}

.bb-todo {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  position: relative;
}
.bb-todo-label {
  font-variant: small-caps;
  letter-spacing: 0.1em;
  font-size: 0.8rem;
  color: #8b5a2b;
  border-bottom: 1px solid #d8c8a8;
  padding-bottom: 0.2rem;
  margin-bottom: 0.4rem;
}
.bb-todo-text {
  flex: 1;
  font-size: 1.2rem;
  line-height: 1.35;
  color: #1a1a1a;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.bb-todo-text-input {
  flex: 1;
  font-family: inherit;
  font-size: 1.2rem;
  line-height: 1.35;
  color: #1a1a1a;
  background: #fffdf6;
  border: 1px solid #8b5a2b;
  padding: 0.2rem 0.3rem;
  width: 100%;
  box-sizing: border-box;
  resize: none;
}
.bb-todo.bb-done .bb-todo-text {
  text-decoration: line-through;
  color: #c4c0b8;
}
.bb-todo.bb-done .bb-todo-label {
  color: #d4c8b0;
}
.bb-todo-edit {
  position: absolute;
  bottom: 4px;
  right: 6px;
  font-size: 0.75rem;
  color: #999;
  background: transparent;
  border: none;
  padding: 2px 4px;
  cursor: pointer;
  font-family: inherit;
  opacity: 0.6;
}
.bb-todo-edit:hover {
  opacity: 1;
  color: #8b5a2b;
}
.bb-todo-remove {
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 1.1rem;
  line-height: 1;
  color: #999;
  background: transparent;
  border: none;
  padding: 2px 5px;
  cursor: pointer;
  font-family: inherit;
  opacity: 0.5;
}
.bb-todo-remove:hover {
  opacity: 1;
  color: #a04030;
}

@media (max-width: 800px) {
  .bb-page {
    grid-template-columns: 1fr;
  }
  .bb-board {
    grid-template-rows: repeat(3, 110px);
  }
}
</style>

<div class="bb-page">
  <aside class="bb-sidebar">
    <h2>Values</h2>
    <p class="bb-hint">Try to pick at least one goal from each of Being, Belonging, and Becoming.</p>
    <div id="bb-values"></div>
  </aside>

  <div class="bb-board-wrap">
    <div class="bb-board-header">
      <h1>Bentoboard</h1>
      <button class="bb-clear" id="bb-clear">Clear board</button>
    </div>
    <div class="bb-status" id="bb-status">Click a value on the left to add a goal.</div>
    <div class="bb-board" id="bb-board"></div>
  </div>
</div>

<script>
(function() {
  var VALUES = {
    Being: [
      { key: "refresh", name: "Refresh", desc: "Sleep, rest, relax, regroup." },
      { key: "nourish", name: "Nourish", desc: "Food, water, medications." },
      { key: "tend",    name: "Tend",    desc: "Personal hygiene, care, beauty, wardrobe." }
    ],
    Belonging: [
      { key: "nest",    name: "Nest",    desc: "Homemaking, home improvements, gardening." },
      { key: "connect", name: "Connect", desc: "Family, friends." },
      { key: "serve",   name: "Serve",   desc: "Community-oriented, acts of service, helping friends and family." }
    ],
    Becoming: [
      { key: "grow",    name: "Grow",    desc: "Learning, studying, exercise, developing body and mind." },
      { key: "explore", name: "Explore", desc: "Going out, trying new things, leaving the nest, errands." },
      { key: "create",  name: "Create",  desc: "Arts, crafts, writing, music, projects and hobbies." }
    ]
  };

  // Slot layout: 7 slots, mixed sizes
  var SLOTS = [
    { id: 0, size: "big"   },
    { id: 1, size: "small" },
    { id: 2, size: "small" },
    { id: 3, size: "wide"  },
    { id: 4, size: "wide"  },
    { id: 5, size: "small" },
    { id: 6, size: "small" }
  ];

  var STORAGE_KEY = "bentoboard.v1";

  var state = {
    todos: {}, // slotId -> { valueKey, valueName, text, done }
    activeValue: null,
    pendingText: null
  };

  function valueByKey(k) {
    var groups = Object.keys(VALUES);
    for (var i = 0; i < groups.length; i++) {
      var arr = VALUES[groups[i]];
      for (var j = 0; j < arr.length; j++) {
        if (arr[j].key === k) return { value: arr[j], meta: groups[i] };
      }
    }
    return null;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ todos: state.todos }));
    } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && data.todos) state.todos = data.todos;
    } catch (e) {}
  }

  function setStatus(msg, alert) {
    var el = document.getElementById("bb-status");
    el.textContent = msg;
    el.classList.toggle("bb-status-alert", !!alert);
  }

  function renderSidebar() {
    var container = document.getElementById("bb-values");
    container.innerHTML = "";
    Object.keys(VALUES).forEach(function(meta) {
      var section = document.createElement("div");
      section.className = "bb-meta";
      var title = document.createElement("div");
      title.className = "bb-meta-title";
      title.textContent = meta;
      section.appendChild(title);

      VALUES[meta].forEach(function(v) {
        var item = document.createElement("div");
        item.className = "bb-value";
        if (state.activeValue === v.key) item.classList.add("bb-active");
        item.textContent = v.name;
        item.addEventListener("click", function() { onValueClick(v.key); });
        section.appendChild(item);

        var panel = document.createElement("div");
        panel.className = "bb-value-panel";
        var desc = document.createElement("div");
        desc.className = "bb-value-desc";
        desc.textContent = v.desc;
        panel.appendChild(desc);

        var input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Your goal…";
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            commitGoal(v.key, input.value);
          }
        });
        panel.appendChild(input);

        var btn = document.createElement("button");
        btn.textContent = "Next";
        btn.addEventListener("click", function() {
          commitGoal(v.key, input.value);
        });
        panel.appendChild(btn);

        section.appendChild(panel);

        if (state.activeValue === v.key) {
          setTimeout(function() { input.focus(); }, 0);
        }
      });

      container.appendChild(section);
    });
  }

  function renderBoard() {
    var board = document.getElementById("bb-board");
    board.innerHTML = "";
    board.classList.toggle("bb-placing", state.pendingText !== null);
    SLOTS.forEach(function(slot) {
      var el = document.createElement("div");
      el.className = "bb-slot";
      el.setAttribute("data-size", slot.size);
      var todo = state.todos[slot.id];
      if (todo) {
        renderTodo(el, slot.id, todo);
      } else {
        el.classList.add("bb-empty");
        el.addEventListener("click", function() { onSlotClick(slot.id); });
      }
      board.appendChild(el);
    });
  }

  function renderTodo(el, slotId, todo) {
    var t = document.createElement("div");
    t.className = "bb-todo" + (todo.done ? " bb-done" : "");

    var label = document.createElement("div");
    label.className = "bb-todo-label";
    // Backfill metaName for old todos saved before meta was tracked
    if (!todo.metaName) {
      var v = valueByKey(todo.valueKey);
      if (v) todo.metaName = v.meta;
    }
    label.textContent = todo.metaName ? (todo.metaName + ": " + todo.valueName) : todo.valueName;

    var text = document.createElement("div");
    text.className = "bb-todo-text";
    text.textContent = todo.text;

    var editBtn = document.createElement("button");
    editBtn.className = "bb-todo-edit";
    editBtn.textContent = "edit";
    editBtn.title = "Edit this goal";
    editBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      startEdit(t, text, slotId, todo);
    });

    var removeBtn = document.createElement("button");
    removeBtn.className = "bb-todo-remove";
    removeBtn.innerHTML = "&times;";
    removeBtn.title = "Clear this slot";
    removeBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      removeTodo(slotId);
    });

    t.appendChild(label);
    t.appendChild(text);
    t.appendChild(editBtn);
    t.appendChild(removeBtn);
    t.addEventListener("click", function() { toggleDone(slotId); });
    el.appendChild(t);
  }

  function removeTodo(slotId) {
    delete state.todos[slotId];
    save();
    setStatus("Slot cleared. Click a value to fill it.");
    renderBoard();
  }

  function startEdit(todoEl, textEl, slotId, todo) {
    var input = document.createElement("textarea");
    input.className = "bb-todo-text-input";
    input.value = todo.text;
    todoEl.replaceChild(input, textEl);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    var cancelled = false;
    function commit() {
      if (cancelled) return;
      var newText = input.value.trim();
      if (newText) {
        todo.text = newText;
        save();
      }
      renderBoard();
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        input.blur();
      } else if (e.key === "Escape") {
        cancelled = true;
        renderBoard();
      }
    });
    input.addEventListener("click", function(e) { e.stopPropagation(); });
  }

  function onValueClick(key) {
    if (state.activeValue === key) {
      state.activeValue = null;
      state.pendingText = null;
      setStatus("Click a value on the left to add a goal.");
    } else {
      state.activeValue = key;
      state.pendingText = null;
      setStatus("Type your goal, then click Next.");
    }
    renderSidebar();
    renderBoard();
  }

  function commitGoal(key, text) {
    text = (text || "").trim();
    if (!text) {
      setStatus("Please type a goal first.");
      return;
    }
    var emptyCount = SLOTS.filter(function(s) { return !state.todos[s.id]; }).length;
    if (emptyCount === 0) {
      setStatus("Board is full — clear a slot or the whole board before adding more.", true);
      return;
    }
    state.pendingText = { valueKey: key, text: text };
    setStatus("Click a slot to place your goal.");
    renderBoard();
  }

  function onSlotClick(slotId) {
    if (!state.pendingText) return;
    var v = valueByKey(state.pendingText.valueKey);
    state.todos[slotId] = {
      valueKey: state.pendingText.valueKey,
      valueName: v ? v.value.name : state.pendingText.valueKey,
      metaName: v ? v.meta : "",
      text: state.pendingText.text,
      done: false
    };
    state.pendingText = null;
    state.activeValue = null;
    save();
    setStatus("Goal added. Click a value to add another.");
    renderSidebar();
    renderBoard();
  }

  function toggleDone(slotId) {
    var todo = state.todos[slotId];
    if (!todo) return;
    todo.done = !todo.done;
    save();
    renderBoard();
  }

  function clearBoard() {
    if (Object.keys(state.todos).length === 0) {
      setStatus("Board is already empty.");
      return;
    }
    if (!confirm("Clear all goals from the board?")) return;
    state.todos = {};
    state.activeValue = null;
    state.pendingText = null;
    save();
    setStatus("Board cleared.");
    renderSidebar();
    renderBoard();
  }

  document.getElementById("bb-clear").addEventListener("click", clearBoard);

  load();
  renderSidebar();
  renderBoard();
})();
</script>
